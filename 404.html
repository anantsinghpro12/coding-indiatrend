<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting… | Coding IndiaTrend</title>
<!--
  GitHub Pages serves this file for any URL that doesn't match a physical
  file on disk (e.g. /python, /c, /cpp — since only index.html exists).
  We redirect back to index.html, encoding the originally requested path
  in the query string. index.html's inline script below decodes it and
  restores the clean URL via history.replaceState, then script.js renders
  the matching route. This keeps URLs clean with zero backend involved.
-->
<script>
  var path = window.location.pathname + window.location.search + window.location.hash;
  window.location.replace('/?redirect=' + encodeURIComponent(path));
</script>
</head>
<body>
  <p>Redirecting to <a href="/">Coding IndiaTrend</a>…</p>
</body>
</html>
